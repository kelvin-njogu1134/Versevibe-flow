<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In – VerseVibe & Flow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h2>Welcome back</h2>
            <p class="subtitle">Log in to your account</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" aria-label="Show password">👁️</button>
                    </div>
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary">Log in</button>
            </form>

            <div class="form-footer">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                <p><a href="public.html">Browse stories without an account</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { getCurrentUser, isAdminUser, loginUser } from './auth.js';

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('error-message');

        const submitButton = form.querySelector('[type="submit"]');

        try {
            const user = await getCurrentUser();
            if (user) {
                window.location.href = isAdminUser(user) ? 'admin.html' : 'public.html';
            }
        } catch (error) {
            errorDiv.textContent = error.message || 'Unable to check your session. Please try again.';
            errorDiv.style.display = 'block';
        }

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '🙈';
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorDiv.textContent = 'Please fill in both fields.';
                errorDiv.style.display = 'block';
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Logging in...';
            try {
                const user = await loginUser(email, password);
                window.location.href = isAdminUser(user) ? 'admin.html' : 'public.html';
            } catch (error) {
                errorDiv.textContent = error.message || 'Login failed. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Log in';
            }
        });
    </script>
</body>
</html>
