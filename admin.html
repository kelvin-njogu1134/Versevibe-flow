<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin Panel - VerseVibe & Flow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="page1">
  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-book-open"></i>
      <span>VerseVibe & Flow</span>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="public.html"><i class="fas fa-globe"></i> Public Stories</a>
      <a href="admin.html" class="active"><i class="fas fa-shield-alt"></i> Admin Panel</a>
      <a href="edit.html"><i class="fas fa-edit"></i> Manage Stories</a>
    </div>
    <div class="nav-right">
      <span id="adminEmail" class="admin-email"></span>
      <button id="logoutBtn" class="logout-btn-nav"><i class="fas fa-sign-out-alt"></i> Logout</button>
      <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="container">
    <h3><i class="fas fa-pen-fancy"></i> Add New Story</h3>
    <form id="storyForm">
      <label>
        Category
        <select id="category">
          <option value="">All stories</option>
          <option value="Life">Life</option>
          <option value="Inspiration">Inspiration</option>
          <option value="Fiction">Fiction</option>
          <option value="Selfgrowth">Self-growth</option>
          <option value="Money">Money</option>
          <option value="Parenting">Parenting</option>
          <option value="Moments">Moments</option>
          <option value="News">News</option>
        </select>
      </label>

      <label>
        Title
        <input type="text" id="title" placeholder="Captivating story title">
      </label>

      <label>
        Short description
        <textarea id="shortDesc" rows="2" required placeholder="Brief intro..."></textarea>
      </label>

      <label>
        Full story
        <textarea id="fullStory" rows="5" required placeholder="Write the complete story here..."></textarea>
      </label>

      <label>
        Choose image
        <input type="file" id="storyImage" accept="image/*" required>
      </label>

      <button type="submit"><i class="fas fa-plus-circle"></i> Publish Story</button>
    </form>
    <a href="edit.html">
      <button type="button" class="edit-delete-btn"><i class="fas fa-edit"></i> Edit & delete stories</button>
    </a>
  </div>

  <div id="storyMessage"></div>

<script type="module">
  import { onAuthStateChanged, logoutUser, isAdminUser } from './auth.js';

  const adminEmailSpan = document.getElementById('adminEmail');
  const logoutBtn = document.getElementById('logoutBtn');

  onAuthStateChanged((user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    if (!isAdminUser(user)) {
      window.location.href = 'public.html';
      return;
    }
    adminEmailSpan.textContent = user.email;
  });

  logoutBtn.addEventListener('click', async () => {
    await logoutUser();
    window.location.href = 'login.html';
  });
</script>

<script type="module" src="admin.js"></script>

<script>
  (function() {
    const hamburger = document.getElementById('hamburgerBtn');
    const navLinks = document.getElementById('navLinks');

    if (hamburger && navLinks) {
      hamburger.addEventListener('click', (e) => {
        e.stopPropagation();
        navLinks.classList.toggle('show');
      });

      const links = navLinks.querySelectorAll('a');
      links.forEach(link => {
        link.addEventListener('click', () => navLinks.classList.remove('show'));
      });

      window.addEventListener('resize', function() {
        if (window.innerWidth > 768 && navLinks.classList.contains('show')) {
          navLinks.classList.remove('show');
        }
      });
    }
  })();
</script>
</body>
</html>
